services:
  mysql:
    image: mysql:8.4
    container_name: tp2-mysql
    ports:
      - '${DB_PORT}:3306'
    environment:
      # Valeurs lues depuis le fichier .env
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
